    retrieved_at: null  # TODO: requiere que el autor confirme la fecha real de captura
  # --- Parsing CALIBRADO contra data/raw/L10406compilada.md real (2026-09-10) ---
  # Verificado línea por línea con grep/lectura directa del raw_file, no es una suposición.
  # Hallazgo dominante: desde el Art. 1.000 en adelante, el número usa punto
  # como separador de miles ("Art. 1.992") — el scaffold original solo
  # capturaba "\d+" y perdía TODO artículo >= 1000 (963/2046 = 47% de recall
  # inicial; 1037 números con punto de miles medidos por grep, ~coincide con
  # los 1090 "ausentes" de la compuerta completitud). `num` ahora captura
  # "1.992" completo (punto incluido); src/pipeline.py:158 ya hace
  # `.replace(".", "")` antes de int() para tolerarlo (no-op para el resto
  # de los corpus, que nunca capturan un punto literal en `num`).
  # Otros hallazgos: Art. 1-9 llevan indicador ordinal "o" separado por
  # espacio y SIN punto final ("Art. 1 o Toda pessoa..."); Art. 10+ llevan
  # punto sin ordinal ("Art. 10."); sufijos de enmienda tipo "-A" existen
  # ("Art. 421-A", "Art. 1.080-A"). Filas de tabla Markdown para artículos
  # revogados en bloque ("|Art. 757.<br>(Revogado pela Lei nº15.040, de
  # 2024)|Vigência|") son minoritarias (21 casos) y se toleran con el `|`
  # inicial opcional; el contenido de la celda queda como cuerpo del
  # artículo, lo cual es aceptable (no vacío, informa la derogación).
  # Residual (mejorado 2026-09-10, ver src/pipeline.py segment() y
  # docs/notas_gobernanza.md Nota 4): 2 líneas del documento empaquetan
  # varios artículos consecutivos en una sola línea (ej. Art. 789 a Art. 802
  # en la línea 2833). segment() ahora reintenta article_pattern dentro de
  # la misma línea (ver _find_next_article_boundary en src/pipeline.py) y
  # recupera la mayoría de ese grupo; el residual que queda es solo el caso
  # en que la línea empieza con un encabezado de nivel a mitad de línea
  # (ej. "Seção III Do Seguro de Pessoa Art. 789...") — ese primer match
  # sigue sin reconocerse porque el texto previo al primer "Art." no forma
  # parte de article_pattern, límite deliberadamente fuera de alcance de
  # este fix (no se tocan encabezados de nivel a mitad de línea).
  parsing: &parsing_generic_pt_scaffold
    article_pattern: '(?i)^\|?\s*Art\.?\s*(?P<num>\d{1,3}(?:\.\d{3})?)\s*[ºo°]?\.?\s*(?:-\s*(?P<suffix>[A-Z]))?\.?\s*'
    final_article_pattern: '(?i)^Art\.\s*[Ff]inal\b'
    levels:
      - type: parte
        pattern: '(?i)^PARTE\s+(?P<ord>[IVXLCDM]+|GERAL|ESPECIAL)\b'
      - type: libro
        pattern: '(?i)^LIVRO\s+(?P<ord>[IVXLCDM]+|PRIMEIRO|SEGUNDO|TERCEIRO|QUARTO|QUINTO)\b'
      - type: titulo
        pattern: '(?i)^T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
      - type: capitulo
        pattern: '(?i)^CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
      - type: seccion
        pattern: '(?i)^SE[ÇC][ÃA]O\s+(?P<ord>[IVXLCDM]+)\b'
      - type: subseccion
        pattern: '(?i)^SUBSE[ÇC][ÃA]O\s+(?P<ord>[IVXLCDM]+)\b'
    superseded_block_markers:
      - '(?i)^\(revogad[oa]'
    editorial_markers:
      - '(?i)\(reda[çc][ãa]o\s+dada\s+pel[ao][^)]*\)'
      - '(?i)\(inclu[íi]d[oa]\s+pel[ao][^)]*\)'
      - '(?i)\(vide[^)]*\)'
    page_furniture:
      - '^\d{1,4}$'
      - '(?i)^p[áa]gina\s+\d+'
    # Nota (resuelta 2026-09-10): el nivel arriba usaba `type: livro`
    # (portugués), que no está en el Literal LevelType de src/models.py
    # (que solo define "libro", en español) — incompatibilidad de esquema
    # que no rompía este pipeline liviano hoy (extract/segment/referrals/
    # gates no instancia ArticleRecord de Pydantic), pero habría roto la
    # construcción de un ArticleRecord real el día que exista N2/N3 para
    # BR-CC. Se normalizó a `type: libro` aquí en vez de agregar "livro" al
    # Literal de models.py, por dos razones: (1) consistencia interna — los
    # otros 3 niveles de este mismo bloque (titulo/capitulo/seccion) ya
    # usaban el nombre canónico en español pese a que su `pattern` matchea
    # texto en portugués (TÍTULO/CAPÍTULO/SEÇÃO); dejar "livro" como
    # excepción era inconsistente con el propio bloque. (2) LevelType es una
    # taxonomía ESTRUCTURAL compartida entre los 8 corpus LATAM (el objetivo
    # del proyecto es comparar estructura entre códigos, no solo dentro de
    # uno) — el texto real en portugués se preserva íntegro en `label`
    # (la línea cruda "LIVRO I", etc.), así que no se pierde información al
    # normalizar `level_type`. Agregar sinónimos por idioma al Literal
    # (livro, buch, book...) habría bifurcado esa taxonomía sin necesidad.
    # roman_to_int()/WORD_ORD en pipeline.py sigue sin reconocer ordinales
    # en portugués (PRIMEIRO, SEGUNDO...), por lo que esos quedarán con
    # ordinal_int=None — limitación compartida, no corregida en esta ronda.
  codification_scope:
    included:
    - Código Civil 2002
    excluded:
    - LINDB
    rationale: solo texto codificado
  expected_article_count: 2046

