BR-CC:
  jurisdiction: BR
  code_id: CC
  year_tag: '2002'
  display_name: Código Civil brasileiro (Lei nº 10.406/2002)
  adapter: generic_pt
  raw_file: L10406compilada.md
  source:
    official: true
    url: https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm
    note: Presidência da República — Planalto.
    verified_by: Juan Pablo López Mejía
    license: "dominio público — texto oficial, sin restricción de uso conocida"
    retrieved_at: null  # TODO: requiere que el autor confirme la fecha real de captura
  # --- SCAFFOLD de parsing, sin calibrar contra el texto fuente real (ver nota de cabecera) ---
  parsing: &parsing_generic_pt_scaffold
    article_pattern: '(?i)^Art\.\s*(?P<num>\d+)[ºo°]?\s*(?:-(?P<suffix>[A-Z]))?\.?\s*'
    final_article_pattern: '(?i)^Art\.\s*[Ff]inal\b'
    levels:
      - type: parte
        pattern: '(?i)^PARTE\s+(?P<ord>[IVXLCDM]+|GERAL|ESPECIAL)\b'
      - type: livro
        pattern: '(?i)^LIVRO\s+(?P<ord>[IVXLCDM]+|PRIMEIRO|SEGUNDO|TERCEIRO|QUARTO|QUINTO)\b'
      - type: titulo
        pattern: '(?i)^T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
      - type: capitulo
        pattern: '(?i)^CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
      - type: seccion
        pattern: '(?i)^SE[ÇC][ÃA]O\s+(?P<ord>[IVXLCDM]+)\b'
      - type: subseccion
        pattern: '(?i)^SUBSE[ÇC][ÃA]O\s+(?P<ord>[IVXLCDM]+)\b'
    superseded_block_markers:
      - '(?i)^\(revogad[oa]'
    editorial_markers:
      - '(?i)\(reda[çc][ãa]o\s+dada\s+pel[ao][^)]*\)'
      - '(?i)\(inclu[íi]d[oa]\s+pel[ao][^)]*\)'
      - '(?i)\(vide[^)]*\)'
    page_furniture:
      - '^\d{1,4}$'
      - '(?i)^p[áa]gina\s+\d+'
    # TODO: calibrar contra L10406compilada.md real. Nota: el `level_type` "livro"
    # usado arriba no está en el Literal LevelType de src/models.py (que solo
    # define "libro", en español) — se deja documentado como incompatibilidad de
