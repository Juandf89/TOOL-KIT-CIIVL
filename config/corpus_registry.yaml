# TEST-FIXTURE (latio-implementador-pipeline, 2026-09-10)
# ---------------------------------------------------------------------------
# Entrada agregada al final del archivo para no interferir con la corrección
# en paralelo de las 8 fuentes reales de arriba (ver nota de gobernanza al
# inicio del archivo). Dataset SINTÉTICO (data/raw/fixture_test_corpus.md,
# 4 artículos inventados), usado únicamente para poder ejecutar
# src/pipeline.py y src/behavior.py de punta a punta y para tests/
# (ver tests/test_pipeline.py). No es un código civil real: no usar para
# métricas de gobernanza ni citar como fuente. `parsing` aquí SÍ está
# calibrado línea por línea contra su raw_file (a diferencia de los
# scaffolds de arriba), porque el raw_file fue escrito a mano para calzar.
# ---------------------------------------------------------------------------
