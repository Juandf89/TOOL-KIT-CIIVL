# config/corpus_registry.yaml — Registro de fuentes del corpus LATIO.
#
# ---------------------------------------------------------------------------
# NOTA DE GOBERNANZA (2026-09-10, latio-implementador-datos)
# ---------------------------------------------------------------------------
# Este archivo fue corregido para añadir tres campos que faltaban en las 8
# fuentes y que impedían/afectaban la trazabilidad de gobernanza de datos:
#
# 1. `parsing` — src/pipeline.py lee `cfg["parsing"]` de forma obligatoria
#    (sin default) en extract() y segment(); su ausencia causaba KeyError
#    inmediato antes de procesar una sola línea. Los bloques `parsing` que
#    se agregan aquí son SCAFFOLD: se derivaron de los patrones que
#    pipeline.py ya usa internamente (NUM_REF/ANA_REF con flag inline
#    `(?i)`, roman_to_int()/WORD_ORD para ordinales) y de convenciones
#    tipográficas típicas de códigos civiles hispano/luso-parlantes
#    (ARTÍCULO/Art., LIBRO, TÍTULO, CAPÍTULO, SECCIÓN...). NO fueron
#    verificados línea por línea contra el texto crudo de cada raw_file.
#    Antes de tratar cualquier salida del pipeline como válida, cada bloque
#    debe calibrarse contra su fuente real (ver TODO en cada uno).
#
# 2. `license` — dato objetivo pero razonablemente derivable: las 8 fuentes
#    son textos legales oficiales publicados por un Estado (boletines/
#    portales oficiales), sin marca de copyright restrictivo declarada en
#    la fuente. Se documenta como
#    "dominio público — texto oficial, sin restricción de uso conocida",
#    con la advertencia de que esto es un default razonable, no una
#    verificación jurídica formal de cada jurisdicción.
#
# 3. `retrieved_at` — fecha real de captura del archivo (distinta de
#    `version_date`, que es la vigencia de la norma). No existe forma de
#    derivar este dato desde el propio repositorio (no hay metadata de
#    descarga, ni timestamps de git en este working tree — ver B-4 en
#    reports/debate_revision_2026-09-10.md). Se deja `null` explícito con
#    TODO en las 8 fuentes; usar la fecha de hoy habría sido fabricar
#    procedencia, que es peor que dejarla vacía.
#
# La discrepancia de alcance entre docs/informe_hito1.md (dice "Chile y
# Colombia") y reports/manifest.json (total_articles_evaluated: 21957,
# consistente con las 8 fuentes) se documenta en docs/notas_gobernanza.md
# y en una nota agregada a informe_hito1.md — no se resuelve aquí porque
# no puede verificarse cuál de los dos es correcto sin volver a correr el
# pipeline real contra las 8 fuentes.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# ANCHOR COMPARTIDO DESACOPLADO (latio-implementador-datos-CL-CC, 2026-09-10)
# ---------------------------------------------------------------------------
# El bloque `parsing` de CL-CC originalmente DEFINÍA el anchor YAML
# `&parsing_generic_es_scaffold`, reutilizado por alias (`*parsing_generic_es_scaffold`)
# en AR-CC, AR-CCYC, MX-CCF, MX-CDMX y PE-CC. Calibrar el contenido de ese
# anchor directamente dentro del bloque CL-CC habría cambiado también, en
# cascada, el parsing EFECTIVO de esas otras 5 fuentes — que otros agentes
# están calibrando en paralelo contra sus propios raw_file en esta misma
# ronda, sin tocar ninguna línea de sus bloques. Para evitar esa colisión, el
# anchor se movió a este nodo de nivel superior, fuera del árbol de cualquier
# corpus_id real: `load_registry()`/`run_corpus()` en src/pipeline.py indexan
# siempre por `registry[corpus_id]` exacto (ver src/pipeline.py líneas
# 53-54, 275-278), así que un nodo extra aquí no afecta a
# `python -m src.pipeline <ID>` para ningún corpus, incluido este mismo.
# El CONTENIDO de este nodo es una copia idéntica y SIN CAMBIOS del scaffold
# original — sigue sin calibrar, tal como estaba, a la espera de que cada
# agente responsable calibre su propio bloque (AR-CC/AR-CCYC/MX-CCF/MX-CDMX/
# PE-CC pueden seguir usando este alias mientras no lo calibren, o
# reemplazarlo por un mapping literal propio, igual que se hizo abajo con
# CL-CC). El bloque `CL-CC.parsing` ya NO usa este anchor: es un mapping
# literal, calibrado de forma independiente contra el texto real de
# Código_Civil_Chileno.MD (ver comentario dentro del bloque CL-CC).
_SHARED_SCAFFOLD_generic_es_SIN_CALIBRAR: &parsing_generic_es_scaffold
  article_pattern: '(?i)^Art[íi]culo\s+(?P<num>\d+)\s*(?P<suffix>bis|ter|quater|quinquies|[A-Z]|[°ºª])?\.?\s*[-–—]?\s*'
  final_article_pattern: '(?i)^Art[íi]culo\s+[Ff]inal\b'
  levels:
    - type: parte
      pattern: '(?i)^PARTE\s+(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
    - type: libro
      pattern: '(?i)^LIBRO\s+(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
    - type: titulo
      pattern: '(?i)^T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|PRELIMINAR)\b'
    - type: capitulo
      pattern: '(?i)^CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
    - type: seccion
      pattern: '(?i)^SECCI[ÓO]N\s+(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA)\b'
    - type: parrafo
      pattern: '(?i)^P[ÁA]RRAFO\s+(?P<ord>[IVXLCDM]+|\d+)\b'
  superseded_block_markers:
    - '(?i)^\(derogad[oa]'
  editorial_markers:
    - '(?i)\(modificad[oa]\s+por[^)]*\)'
    - '(?i)\(adicionad[oa]\s+por[^)]*\)'
    - '(?i)\(nota\s+de\s+vigencia[^)]*\)'
  page_furniture:
    - '^\d{1,4}$'
    - '(?i)^p[áa]gina\s+\d+'
# ---------------------------------------------------------------------------

CL-CC:
  jurisdiction: CL
  code_id: CC
  year_tag: '1855'
  display_name: Código Civil de Chile
  adapter: generic_es
  raw_file: Código_Civil_Chileno.MD
  source:
    official: true
    url: https://www.bcn.cl/leychile/navegar/imprimir?idNorma=172986&idVersion=2025-08-28
    version_date: '2025-08-28'
    note: BCN Ley Chile.
    verified_by: Juan Pablo López Mejía
    license: "dominio público — texto oficial, sin restricción de uso conocida"
    retrieved_at: null  # TODO: requiere que el autor confirme la fecha real de captura
  # --- CALIBRADO contra Código_Civil_Chileno.MD real (latio-implementador-datos-CL-CC, 2026-09-10) ---
  # Verificado línea por línea con grep/regex directamente contra el raw_file
  # (12829 líneas). Ya NO usa el anchor compartido `&parsing_generic_es_scaffold`
  # (ver nodo "_SHARED_SCAFFOLD_generic_es_SIN_CALIBRAR" arriba, antes de este
  # bloque, y su comentario "ANCHOR COMPARTIDO DESACOPLADO"): este mapping es
  # literal y propio de CL-CC, para no afectar en cascada a AR-CC/AR-CCYC/
  # MX-CCF/MX-CDMX/PE-CC, que siguen (o dejan de seguir) ese alias por decisión
  # de sus propios agentes.
  #
  # Hallazgos de la verificación:
  #  - Encabezado de artículo real: "Artículo N. " — SIN prefijo Markdown "#"
  #    (0 líneas "#...Artículo" en todo el archivo, a diferencia de CO-CC) y
  #    SIN sufijo ordinal "o."/"º" pegado al número (0 casos: "8o.", "1º" NO
  #    aparecen nunca como parte del número de artículo). Dos variantes reales
  #    que el scaffold original no cubría:
  #     (a) numeración compuesta con guion, de artículos insertados por leyes
  #         de reforma (filiación, sociedad conyugal, cuidado personal, etc.):
  #         "Artículo 225-2.", "Artículo 229-2.", "Artículo 548-1." a "-4.",
  #         "Artículo 551-1./-2.", "Artículo 557-1." a "-3.", y "Artículo
  #         1792-1." a "1792-27." (con un caso atípico de espacio real en el
  #         propio archivo: "Artículo 1792- 5.", que el regex de abajo también
  #         cubre con `[\s-]+`) — 37 artículos con este formato.
  #     (b) sufijo "BIS"/"TER" pospuesto con espacio (no con guion ni pegado
  #         al número): "Artículo 58 BIS.", "Artículo 58 TER." — 4 artículos.
  #    El artículo final usa "Artículo FINAL." y ya lo cubría
  #    final_article_pattern sin cambios.
  #    Total real de encabezados "Artículo ..." en el archivo: 2567 (2566
  #    numéricos/guion/BIS/TER + 1 "FINAL") contra expected_article_count:
  #    2524. La diferencia (+43) es esperable, no un sobre-conteo: 2524 es el
  #    número del último artículo de la numeración original de 1857 (ver
  #    "Artículo 2524." seguido de "Título Final" / "Artículo FINAL." al
  #    cierre del archivo), pero leyes posteriores insertaron artículos con
  #    numeración "-N"/BIS/TER que se suman a esa numeración sin reemplazarla
  #    (p.ej. los 27 artículos "1792-N" de la Ley 19.335 sobre participación
  #    en los gananciales). No se fuerza el número a 2524: el recall real
  #    esperado tras esta calibración es >100% de expected_article_count por
  #    esta razón estructural, verificable en reports/CL-CC_run_report.json.
  #  - Jerarquía real (LIBRO > Título > § — SIN CAPÍTULO/SECCIÓN/PARTE en todo
  #    el archivo: 0 casos de los tres):
  #     * "LIBRO PRIMERO"/"SEGUNDO"/"TERCERO"/"CUARTO" — 4 casos, cubierto sin
  #       cambios por el patrón heredado del scaffold.
  #     * "Título <romano>" — 98 casos, en minúscula-mixta ("Título I", no
  #       "TÍTULO I"), MÁS dos excepciones atípicas de OCR/edición en mayúscula
  #       completa y sin tilde: "TITULO PRELIMINAR" (línea 3) y "TITULO VIII"
  #       (línea 958). El patrón de abajo cubre ambas formas gracias a (?i)
  #       sobre la clase de caracteres [ÍI], verificado con Python re. También
  #       existe "Título Final" al cierre del documento (añadido "FINAL" al
  #       grupo `ord`, que el scaffold original no contemplaba).
  #     * "§ N. <texto>" — 155 casos, símbolo de párrafo + número arábigo. LA
  #       PALABRA "PARRAFO"/"PÁRRAFO" NO APARECE NUNCA en el archivo (0 casos):
  #       se reemplazó por completo el patrón heredado (que buscaba
  #       "PÁRRAFO N") por uno que matchea el símbolo "§" real.
  #    Se eliminaron del scaffold los niveles "parte", "capitulo" y "seccion"
  #    por no tener ningún caso real en este archivo (mantenerlos no rompía
  #    nada, pero era ruido no verificado — un nivel jerárquico que nunca
  #    matchea no debe quedar documentado como si existiera en esta fuente).
  #  - Furniture de página: NO se encontró ningún patrón repetido de furniture
  #    en este archivo — 0 líneas en negrita-cursiva Markdown (a diferencia
  #    del "**_Ley 57 de 1887_**" de CO-CC), 0 líneas de solo dígitos (no hay
  #    numeración de página como línea propia), 0 encabezados/pies de página
  #    reconocibles. Las 3 apariciones de "página" en el archivo son texto
  #    sustantivo de los artículos sobre testamentos militares/marítimos
  #    (rúbrica "al principio y fin de cada página"), no furniture. Se deja
  #    page_furniture vacío en vez de mantener patrones del scaffold que nunca
  #    matchearían nada real en esta fuente (honestidad de calibración >
  #    mantener ruido heredado).
  #  - Notas editoriales inline: NO hay marcadores parentéticos tipo
  #    "(modificado por...)" ni líneas "NOTA:" (0 casos de ambos formatos que
  #    sí usa CO-CC). Lo que sí existe, verificado, son citas legislativas
  #    sueltas SIN paréntesis, tanto intercaladas en el cuerpo de artículos
  #    vigentes como formando el cuerpo completo de artículos derogados
  #    (p.ej. "Artículo 29." con cuerpo íntegro "Derogado. L. 19.585"; 130
  #    líneas del archivo contienen la palabra "Derogado", 39 de ellas citan
  #    exactamente "L. 19.585"). Estos artículos derogados SÍ cuentan dentro
  #    de expected_article_count: siguen siendo encabezados de artículo
  #    numerados secuencialmente, no un bloque a descartar. Por eso
  #    superseded_block_markers queda vacío (lista []) en vez de heredar el
  #    patrón del scaffold original ("^\(derogad[oa]", que en este archivo no
  #    matchea nunca — 0 casos de "(Derogado" con paréntesis — así que no
  #    hacía daño, pero tampoco hacía nada real): usarlo como plantilla para
  #    detectar "Derogado" a secas (sin paréntesis) habría sido un error real,
  #    porque el pipeline salta por completo las líneas marcadas como
  #    "superseded" (ver segment() en src/pipeline.py, rama `in_superseded`),
  #    lo que habría vaciado el cuerpo de decenas de artículos derogados
  #    legítimos y los habría marcado incorrectamente como "empty_body". En su
  #    lugar, esas citas de ley sueltas se capturan como editorial_markers
  #    (abajo) para extraerlas a editorial_notes sin destruir el resto del
  #    cuerpo del artículo.
  parsing:
    article_pattern: '(?i)^Art[íi]culo\s+(?P<num>\d+)(?:[\s-]+(?P<suffix>\d+|BIS|TER|QUATER|QUINQUIES))?\.?\s*'
    final_article_pattern: '(?i)^Art[íi]culo\s+[Ff]inal\b'
    levels:
      - type: libro
        pattern: '(?i)^LIBRO\s+(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
      - type: titulo
        pattern: '(?i)^T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|PRELIMINAR|FINAL)\b'
      - type: parrafo
        pattern: '^§\s*(?P<ord>\d+)\.?'
    superseded_block_markers: []
    editorial_markers:
      - '(?i)\bL\.\s*\d[\d.]*\s*(,?\s*Art\.\s*\d+[ºo°]?)?'
      - '(?i)\bD\.F\.L\.\s*N[ºo°]?\s*[\d.,]+'
      - '(?i)\bL\.\s+de\s+Matrimonio\b'
    page_furniture: []
    # Pendiente (no bloqueante para expected_article_count): roman_to_int() en
    # src/pipeline.py solo resuelve ordinales masculinos (WORD_ORD:
    # PRIMERO..QUINTO) — como los 4 "LIBRO" de este archivo usan justamente
    # esa forma masculina, ordinal_int sí resuelve bien para "libro" aquí; no
    # aplica a "titulo" (usa números romanos) ni a "parrafo" (usa dígitos
    # arábigos vía roman_to_int, que devolverá None para "1","2"... porque
    # espera números romanos, no arábigos — limitación conocida y compartida
    # del pipeline, no de este bloque; no se corrige aquí porque
    # src/pipeline.py es propiedad de otro agente en esta ronda). La compuerta
    # consistencia_N4 (resolución de remisiones) es una limitación conocida y
    # compartida del pipeline (NUM_REF/ANA_REF solo numéricas/anafóricas) y
    # queda fuera del alcance de esta calibración.
  codification_scope:
    included:
    - Código Civil, texto de trabajo
    excluded:
    - Ley 19.947 de Matrimonio Civil
    - legislación complementaria
    rationale: solo texto codificado
  expected_article_count: 2524

CO-CC:
  jurisdiction: CO
  code_id: CC
  year_tag: '1873'
  display_name: Código Civil de Colombia (Ley 84 de 1873, vía Ley 57 de 1887)
  adapter: co_eva
  raw_file: ley_57_de_1887.md
  source:
    official: true
    url: https://bogota.gov.co/sites/default/files/inline-files/ley_57_de_1887.pdf
    note: Gestor Normativo — Función Pública.
    verified_by: Juan Pablo López Mejía
    license: "dominio público — texto oficial, sin restricción de uso conocida"
    retrieved_at: null  # TODO: requiere que el autor confirme la fecha real de captura
  # --- CALIBRADO contra data/raw/ley_57_de_1887.md (2026-09-10, ronda de calibración) ---
  # Fuente: Markdown OCR/PDF del Gestor Normativo (Función Pública). Hallazgos:
  #  - El marcador "## " de encabezado Markdown es INCONSISTENTE: ~45% de los
  #    "ARTICULO N" y ~15% de los encabezados de nivel (LIBRO/TITULO/CAPITULO)
  #    llevan "## " delante, el resto no. article_pattern y los level patterns
  #    aceptan un prefijo "#{1,3}" opcional para cubrir ambas formas.
  #  - El grupo `suffix` original incluía la alternativa `[A-Z]` sin exigir que
  #    fuera contigua al número/indicador ordinal. Como los títulos de artículo
  #    van en MAYÚSCULAS justo después (p.ej. "ARTICULO 8o. FUERZA DE LA
  #    COSTUMBRE."), ese `[A-Z]` capturaba la primera letra del título como si
  #    fuera un sufijo real (bug que explicaba with_suffix: 1590/1606 en el
  #    scaffold). Verificado con grep sobre todo el corpus: NO existen artículos
  #    con sufijo real bis/ter/letra en este texto (2684 "ARTICULO N" == 2684
  #    esperados, sin numeración compuesta). Se deja bis|ter con lookahead
  #    negativo (sin espacio de separación, para no comerse palabras como
  #    "TERMINACION") como salvaguarda a futuro, pero se retira `[A-Z]` suelto.
  #  - BUG DE PÉRDIDA DE DATOS en el scaffold: `superseded_block_markers` tenía
  #    '(?i)^\(derogad[oa]' que en este corpus NO marca un bloque derogado
  #    completo, sino una nota parentética suelta en medio de un artículo
  #    vigente (p.ej. línea 865: "(Derogado por el Art.61 de la Ley 1996 de
  #    2019)" dentro del Art. 127, entre los incisos 3o) y 4o); línea 8455,
  #    ídem dentro del Art. 1061). Con el patrón activo, segment() marcaba
  #    in_superseded=True y DESCARTABA los incisos siguientes del artículo
  #    hasta el próximo Art./nivel — se perdía texto vigente real. Se deja
  #    superseded_block_markers vacío: no se detectó en el corpus ningún bloque
  #    (LIBRO/TITULO/rango de artículos) genuinamente derogado en bloque que
  #    deba saltarse completo; las derogaciones aquí son puntuales (por
  #    artículo o por inciso) y se documentan vía editorial_markers en vez de
  #    provocar un salto de segmentación.
  #  - furniture_lines_removed: 0 en el scaffold porque `^\d{1,4}$` no
  #    coincidía con nada: el furniture real va envuelto en negrita-cursiva
  #    Markdown ("**_Ley 57 de 1887_**", "**_EVA - Gestor Normativo_**",
  #    "**_Departamento Administrativo de la Función Pública_**") y los
  #    números de página como "**_2_**", no como números sueltos.
  #  - Anomalía real (no corregible por regex, documentada, no forzada): el
  #    texto incrusta citas literales de DECRETOS reglamentarios con su propia
  #    numeración de artículos reiniciada desde "1o" (p.ej. tras el Art. 1080
  #    aparece "ARTICULO 1o", "2o", "3o", "4o" de un decreto citado, y tras el
  #    Art. 1082 aparece otro tramo "ARTICULO 59"…"67" de otro decreto citado,
  #    antes de retomar el Art. 1081/1083 del Código Civil). El guard existente
  #    de pipeline.py (INTERPOLATION_JUMP=50, no forma parte de este bloque de
  #    parsing) ya descarta correctamente estos tramos como
  #    rejected_non_monotonic sin contaminar el artículo CC en curso — se deja
  #    así, es responsabilidad del pipeline, no del parsing config.
  #  - El propio raw_file no contiene los artículos 1-7 (el documento arranca
  #    directamente en "ARTICULO 8o."): faltante real de la fuente, no bug de
  #    parsing — quedará reflejado como "ausentes" en la compuerta de
  #    completitud.
  #  - Título de capítulo partido en dos líneas de nivel consecutivas (p.ej.
  #    "## CAPITULO III." seguido de "## EFECTOS DE LA LEY" en la línea
  #    siguiente) no se corrige aquí: exigiría que segment() (pipeline.py, de
  #    otro agente en esta ronda) fusione dos líneas de nivel consecutivas: el
  #    label del nodo "capitulo" queda con el numeral pero sin el título
  #    descriptivo. No afecta el conteo de artículos.
  parsing:
    article_pattern: '(?i)^(?:#{1,3}\s*)?Art[íi]?culo\s+(?P<num>\d+)\s*[°ºo]?\.?\s*(?:(?P<suffix>bis|ter)(?![A-Za-zÁÉÍÓÚÑáéíóúñ]))?\.?\s*[-–—]?\s*'
    final_article_pattern: '(?i)^(?:#{1,3}\s*)?Art[íi]?culo\s+[Ff]inal\b'
    levels:
      - type: libro
        pattern: '(?i)^(?:#{1,3}\s*)?LIBRO\s+(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
      - type: titulo
        pattern: '(?i)^(?:#{1,3}\s*)?T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|PRELIMINAR)\b'
      - type: capitulo
        pattern: '(?i)^(?:#{1,3}\s*)?CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
      - type: seccion
        pattern: '(?i)^(?:#{1,3}\s*)?SECCI[ÓO]N\s+(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA)\b'
    superseded_block_markers: []
    editorial_markers:
      - '(?i)NOTA:?\s+[^.]*\.'
      - '(?i)\([^)]*(?:EXEQUIBLE|INEXEQUIBLE|[Mm]odificad[oa]|[Dd]eclarad[oa]|[Dd]erogad[oa]|[Aa]dicionad[oa]|[Ss]ubrogad[oa])[^)]*\)'
      # OJO: NO usar '[^.]*\.' (hasta el próximo punto) aquí — "art." es una
      # abreviatura con su propio punto interno, y cuando el cuerpo sólo tiene
      # UN punto real más adelante (p.ej. Art. 320: "Derogado por el art. 65,
      # Ley 153 de 1887 Podrá entablar la demanda...crianza.", sin punto entre
      # la cita y el texto sustantivo que sigue), un patrón así se come TODO
      # el cuerpo del artículo de un salto (bug detectado y corregido en esta
      # calibración: producía empty_body en CO-CC-1873-ART-320). En su lugar,
      # se acota el lazy-match a la forma real de la cita legal ("... de
      # <año>", "C.P.C", "Procedimiento Civil" o "Código ...").
      - '(?i)Derogado\s+por\s+(?:el\s+)?(?:art(?:[íi]culo)?\.?|literal)\s+.*?(?:de\s+\d{4}\b|C\.\s?P\.\s?C\.?|Procedimiento\s+Civil\b|C[óo]digo[^,.]{0,30})'
      - '(?i)Subrogado\s+por\s+(?:el\s+)?art(?:[íi]culo)?\.?\s+.*?(?:de\s+\d{4}\b|C\.\s?P\.\s?C\.?|Procedimiento\s+Civil\b|C[óo]digo[^,.]{0,30})'
