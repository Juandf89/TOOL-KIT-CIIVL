# config/corpus_registry.yaml — Registro de fuentes del corpus LATIO.
#
# ---------------------------------------------------------------------------
# NOTA DE GOBERNANZA (2026-09-10, latio-implementador-datos)
# ---------------------------------------------------------------------------
# Este archivo fue corregido para añadir tres campos que faltaban en las 8
# fuentes y que impedían/afectaban la trazabilidad de gobernanza de datos:
#
# 1. `parsing` — src/pipeline.py lee `cfg["parsing"]` de forma obligatoria
#    (sin default) en extract() y segment(); su ausencia causaba KeyError
#    inmediato antes de procesar una sola línea. Los bloques `parsing` que
#    se agregan aquí son SCAFFOLD: se derivaron de los patrones que
#    pipeline.py ya usa internamente (NUM_REF/ANA_REF con flag inline
#    `(?i)`, roman_to_int()/WORD_ORD para ordinales) y de convenciones
#    tipográficas típicas de códigos civiles hispano/luso-parlantes
#    (ARTÍCULO/Art., LIBRO, TÍTULO, CAPÍTULO, SECCIÓN...). NO fueron
#    verificados línea por línea contra el texto crudo de cada raw_file.
#    Antes de tratar cualquier salida del pipeline como válida, cada bloque
#    debe calibrarse contra su fuente real (ver TODO en cada uno).
#
# 2. `license` — dato objetivo pero razonablemente derivable: las 8 fuentes
#    son textos legales oficiales publicados por un Estado (boletines/
#    portales oficiales), sin marca de copyright restrictivo declarada en
#    la fuente. Se documenta como
#    "dominio público — texto oficial, sin restricción de uso conocida",
#    con la advertencia de que esto es un default razonable, no una
#    verificación jurídica formal de cada jurisdicción.
#
# 3. `retrieved_at` — fecha real de captura del archivo (distinta de
#    `version_date`, que es la vigencia de la norma). No existe forma de
#    derivar este dato desde el propio repositorio (no hay metadata de
#    descarga, ni timestamps de git en este working tree — ver B-4 en
#    reports/debate_revision_2026-09-10.md). Se deja `null` explícito con
#    TODO en las 8 fuentes; usar la fecha de hoy habría sido fabricar
#    procedencia, que es peor que dejarla vacía.
#
# La discrepancia de alcance entre docs/informe_hito1.md (dice "Chile y
# Colombia") y reports/manifest.json (total_articles_evaluated: 21957,
# consistente con las 8 fuentes) se documenta en docs/notas_gobernanza.md
# y en una nota agregada a informe_hito1.md — no se resuelve aquí porque
# no puede verificarse cuál de los dos es correcto sin volver a correr el
# pipeline real contra las 8 fuentes.
# ---------------------------------------------------------------------------

CL-CC:
  jurisdiction: CL
  code_id: CC
  year_tag: '1855'
  display_name: Código Civil de Chile
  adapter: generic_es
  raw_file: Código_Civil_Chileno.MD
  source:
    official: true
    url: https://www.bcn.cl/leychile/navegar/imprimir?idNorma=172986&idVersion=2025-08-28
    version_date: '2025-08-28'
    note: BCN Ley Chile.
    verified_by: Juan Pablo López Mejía
    license: "dominio público — texto oficial, sin restricción de uso conocida"
    retrieved_at: null  # TODO: requiere que el autor confirme la fecha real de captura
  # --- SCAFFOLD de parsing, sin calibrar contra el texto fuente real (ver nota de cabecera) ---
  parsing: &parsing_generic_es_scaffold
    article_pattern: '(?i)^Art[íi]culo\s+(?P<num>\d+)\s*(?P<suffix>bis|ter|quater|quinquies|[A-Z]|[°ºª])?\.?\s*[-–—]?\s*'
    final_article_pattern: '(?i)^Art[íi]culo\s+[Ff]inal\b'
    levels:
      - type: parte
        pattern: '(?i)^PARTE\s+(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
      - type: libro
        pattern: '(?i)^LIBRO\s+(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
      - type: titulo
        pattern: '(?i)^T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|PRELIMINAR)\b'
      - type: capitulo
        pattern: '(?i)^CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
      - type: seccion
        pattern: '(?i)^SECCI[ÓO]N\s+(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA)\b'
      - type: parrafo
        pattern: '(?i)^P[ÁA]RRAFO\s+(?P<ord>[IVXLCDM]+|\d+)\b'
    superseded_block_markers:
      - '(?i)^\(derogad[oa]'
    editorial_markers:
      - '(?i)\(modificad[oa]\s+por[^)]*\)'
      - '(?i)\(adicionad[oa]\s+por[^)]*\)'
      - '(?i)\(nota\s+de\s+vigencia[^)]*\)'
    page_furniture:
      - '^\d{1,4}$'
      - '(?i)^p[áa]gina\s+\d+'
    # TODO: calibrar (o descartar) estos patrones contra Código_Civil_Chileno.MD real
    # antes de confiar en segment()/gates() para esta fuente. Nota: roman_to_int()
    # en pipeline.py solo resuelve ordinales masculinos (WORD_ORD: PRIMERO..QUINTO);
    # los ordinales femeninos capturados arriba (PRIMERA, SEGUNDA...) quedarán con
    # ordinal_int=None — limitación conocida del scaffold, no corregida aquí porque
    # pipeline.py es propiedad de otro agente en esta ronda.
  codification_scope:
    included:
    - Código Civil, texto de trabajo
    excluded:
    - Ley 19.947 de Matrimonio Civil
    - legislación complementaria
    rationale: solo texto codificado
  expected_article_count: 2524

CO-CC:
  jurisdiction: CO
  code_id: CC
  year_tag: '1873'
  display_name: Código Civil de Colombia (Ley 84 de 1873, vía Ley 57 de 1887)
  adapter: co_eva
  raw_file: ley_57_de_1887.md
  source:
    official: true
    url: https://bogota.gov.co/sites/default/files/inline-files/ley_57_de_1887.pdf
    note: Gestor Normativo — Función Pública.
    verified_by: Juan Pablo López Mejía
    license: "dominio público — texto oficial, sin restricción de uso conocida"
    retrieved_at: null  # TODO: requiere que el autor confirme la fecha real de captura
  # --- SCAFFOLD de parsing, sin calibrar contra el texto fuente real (ver nota de cabecera) ---
  # Variante co_eva: texto decimonónico transcrito (Ley 57 de 1887); se asume
  # numeración "ARTICULO N." con indicador ordinal ("1o.") ocasional y anotaciones
  # editoriales de vigencia típicas del Gestor Normativo colombiano. Sin calibrar.
  parsing:
    article_pattern: '(?i)^Art[íi]?culo\s+(?P<num>\d+)[oº°]?\.?\s*(?P<suffix>bis|ter|[A-Z])?\.?\s*[-–—]?\s*'
    final_article_pattern: '(?i)^Art[íi]?culo\s+[Ff]inal\b'
    levels:
      - type: libro
        pattern: '(?i)^LIBRO\s+(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
      - type: titulo
        pattern: '(?i)^T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|PRELIMINAR)\b'
      - type: capitulo
        pattern: '(?i)^CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
      - type: seccion
        pattern: '(?i)^SECCI[ÓO]N\s+(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA)\b'
    superseded_block_markers:
      - '(?i)^\(derogad[oa]'
      - '(?i)^Ley\s+153\s+de\s+1887'  # ver M-4 del debate: fuente conexa excluida del corpus
    editorial_markers:
      - '(?i)\(modificad[oa]\s+por[^)]*\)'
      - '(?i)\(adicionad[oa]\s+por[^)]*\)'
      - '(?i)nota\s+de\s+vigencia[^.]*\.?'
      - '(?i)jurisprudencia\s+vigencia[^.]*\.?'
    page_furniture:
      - '^\d{1,4}$'
    # TODO: calibrar contra ley_57_de_1887.md real; esta fuente además carece de
    # version_date (ver M-8 del debate de revisión), lo cual queda fuera del
    # alcance de esta corrección (solo se agregó retrieved_at, no version_date).
  codification_scope:
    included:
    - Código Civil, texto codificado vigente
    excluded:
    - Ley 153 de 1887
    - Título III de la Constitución de 1886
    rationale: solo texto codificado
  expected_article_count: 2684

