  #    origen): "**<u>CÓDIGO CIVIL FEDERAL</u>**", "_Última Reforma DOF 17-01-2024_",
  #    la línea de la Cámara de Diputados (a veces como párrafo, a veces como tabla
  #    Markdown con espacios comidos: "CÁMARA DEDIPUTADOS DELH. CONGRESO..."), y el folio
  #    "N de 368". Todo esto se excluye para que no contamine el cuerpo de los artículos.
  #  - ANOMALÍA REAL DE OCR (no corregible por regex, no forzada): en 14 saltos de página
  #    el conversor PDF→MD confundió una imagen/marca de agua con texto y la volcó como
  #    "<!-- Start of picture text -->\nSRL.<br>Waa W é<br>= Bex a<br>ae\n<!-- End of picture
  #    text -->", que en 5 de esos 14 casos cae justo donde debían ir los encabezados de
  #    artículo, borrándolos del origen: faltan por completo (no truncados, no reformateados,
  #    ausentes) los artículos 93-98, 398-409, 1494-1501, 2483-2489 y 2912-2920 (42 artículos).
  #    Verificado leyendo el texto circundante: el cuerpo de esos artículos falta o aparece
  #    a mitad de frase después del bloque OCR corrupto. Esto es pérdida de la fuente, no
