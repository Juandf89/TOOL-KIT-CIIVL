AR-CC:
  jurisdiction: AR
  code_id: CC
  year_tag: '1869'
  display_name: Código Civil de la República Argentina (Vélez Sarsfield)
  adapter: generic_es
  raw_file: codido_civil_argentino.md
  source:
    official: true
    url: https://www.rpba.gov.ar/files/Normas/Leyes/CC.pdf
    note: Código de Vélez Sarsfield, derogado. Corpus histórico.
    verified_by: Juan Pablo López Mejía
    license: "dominio público — texto oficial, sin restricción de uso conocida"
    retrieved_at: null  # TODO: requiere que el autor confirme la fecha real de captura
  # --- Calibrado contra data/raw/codido_civil_argentino.md (verificado línea por
  #     línea con Read/Grep + Python re, no asumido idéntico a otros corpus) ---
  # Marcador de artículo: "Art.N.- texto" (NUNCA "Artículo N"/"ARTICULO N").
  # Variantes reales encontradas en el archivo:
  #   * "Arts.N" (typo con "s") en 7 artículos derogados consecutivos (arts.
  #     3577-3583, ley 23.264) — sin aceptar la "s" no matchean.
  #   * "Art. N" con espacio antes del número — 1 caso (Art. 1631).
  #   * "## Art.N" con prefijo Markdown "##" — 1 caso real (Art.220, línea 1425).
  #     Confirma la advertencia de la consigna sobre prefijo #/## inconsistente
  #     en el marcador de artículo.
  #   * El sufijo ordinal pegado tipo "1ro."/"2do." SÍ aparece muchísimo, pero
  #     como numeración de incisos DENTRO del cuerpo del artículo (nunca como
  #     marcador de artículo), y no puede confundirse con el grupo `suffix`
  #     porque el patrón exige el prefijo literal "Art." antes.
  #   * Sufijos reales de artículo (grupo `suffix`): "bis" (18 casos, incl. una
  #     vez "Bis" mayúscula), "ter" (1), "quater" (1). "quinquies" no aparece;
  #     se deja como alternativa defensiva no verificada.
  # Recall real alcanzable: el archivo tiene ~81 huecos de numeración genuinos
  # (artículos ausentes del texto crudo, sin ningún placeholder "derogado" —
  # p.ej. 23-29, 364-376, 690-698, 764-817, 1510, 1604, 3799-3809). No es un
  # problema de regex: es contenido real faltante, probablemente por pérdida de
  # páginas en la conversión PDF->Markdown — de hecho el bloque de arts. 667-689
  # y 784-800 aparece DUPLICADO dos y tres veces en el archivo mientras que el
  # Título XIII completo y gran parte del Título XVI "Del pago" desaparecieron.
  # Ningún ajuste de article_pattern puede recuperar texto que no está en el
  # archivo. Además los artículos 342 y 343 SÍ existen pero están pegados en la
  # MISMA línea física que el 341 ("Art.341.- Derogado... Art.342.- Derogado...
  # Art.343.- Derogado...", línea 2059): segment() en pipeline.py usa
  # art_re.match() anclado al inicio de línea, así que un artículo a mitad de
  # línea nunca puede matchear sin importar el regex (limitación de
  # pipeline.py, no de este bloque de config; pipeline.py es propiedad de otro
  # agente en esta ronda — ver nota equivalente en el scaffold de CL-CC).
  # Techo realista de recall con el pipeline actual: ~3988/4051 (~98.4%).
  # Niveles reales (más profundos que en otros corpus, tal como advierte la
  # consigna): LIBRO > SECCIÓN > (PARTE, opcional, solo en Libro Segundo) >
  # TÍTULO > CAPÍTULO. El formato Markdown de cada nivel es muy inconsistente
  # dentro del propio archivo: "**LIBRO PRIMERO**", "**LIBRO** **<u>SEGUNDO</u>**",
  # "## **Libro Primero**" y "Libro Primero" sin ningún marcado conviven todos.
  # "Capítulo" tiene dos formas: "CAPÍTULO" completa (solo 2 apariciones, al
  # inicio del Libro Primero) y "Cap. N - <texto>" abreviada (~180 apariciones,
  # la forma dominante en el resto del código) — ambas cubiertas abajo. Un caso
  # usa ordinal en palabra ("Cap. Unico") en vez de número romano, por eso se
  # agregó UNICO/ÚNICO a la alternativa de `ord` de capitulo.
  # No se encontraron bloques "(derogado..." tipo CL-CC (0 casos) ni furniture
  # de página (0 líneas de solo dígitos, 0 encabezados/pies repetidos reales —
  # las repeticiones frecuentes de "LIBRO PRIMERO"/"SECCIÓN PRIMERA" entre
  # artículos NO son furniture: son la jerarquía completa reafirmada antes de
  # cada Título nuevo, un patrón real del documento, no ruido de conversión).
  # Se dejan esas dos listas vacías en vez de heredar patrones del scaffold que
  # nunca matchearían nada real en esta fuente.
  # Notas editoriales reales: "(Ver Ley N)" / "(Vease ley N art. N)" /
  # "(Ver leyes N y N)" — paréntesis con cita de ley modificatoria posterior.
  parsing:
    article_pattern: '(?i)^#{0,2}\s*Arts?\.\s*(?P<num>\d+)\s*(?P<suffix>bis|ter|quater|quinquies)?\.?\s*[-–—]?\s*'
    final_article_pattern: '(?i)^Art[íi]culo\s+[Ff]inal\b'
    levels:
      - type: libro
        pattern: '(?i)^#{0,3}\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*LIBRO\b\s*\*{0,3}\s*(?:</u>)?\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
      - type: seccion
        pattern: '(?i)^#{0,3}\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*SECCI[ÓO]N\b\s*\*{0,3}\s*(?:</u>)?\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA)\b'
      - type: parte
        pattern: '(?i)^#{0,3}\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*PARTE\b\s*\*{0,3}\s*(?:</u>)?\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA)\b'
      - type: titulo
        pattern: '(?i)^#{0,3}\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*T[ÍI]TULO\b\s*\*{0,3}\s*(?:</u>)?\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*(?P<ord>[IVXLCDM]+|PRELIMINAR)\b'
      - type: capitulo
        pattern: '(?i)^#{0,3}\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*(?:CAP[IÍ]TULO|CAP\.)\s*\*{0,3}\s*(?:</u>)?\s*\*{0,3}\s*(?:<u>)?\s*\*{0,3}\s*(?P<ord>[IVXLCDM]+|UNICO|ÚNICO)\b'
    superseded_block_markers: []
    editorial_markers:
      - '(?i)\((?:ver|v[eé]ase)\s+ley(?:es)?\s+[^)]*\)'
    page_furniture: []
    # TODO calibración futura: quedan ~81 artículos no recuperables por huecos
    # reales del archivo fuente (ver nota arriba) y 2 artículos (342, 343)
    # técnicamente presentes en el texto pero inalcanzables porque comparten
    # línea física con el 341 y pipeline.py matchea solo al inicio de línea.
  codification_scope:
    included:
    - Código Civil 1869
    excluded:
    - Código Civil y Comercial 2015
    rationale: corpus histórico
  expected_article_count: 4051

