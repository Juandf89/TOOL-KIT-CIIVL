    # tarea (esos archivos están a cargo de otro agente en esta ronda). Además,
    # roman_to_int()/WORD_ORD en pipeline.py solo reconoce ordinales en español
    # (PRIMERO, SEGUNDO...), por lo que "PRIMEIRO", "SEGUNDO" (pt) no resolverán
    # a ordinal_int — limitación conocida, no corregida aquí.
  codification_scope:
    included:
    - Código Civil 2002
    excluded:
    - LINDB
    rationale: solo texto codificado
  expected_article_count: 2046

