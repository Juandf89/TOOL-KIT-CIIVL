  #  - LÍMITE ESTRUCTURAL de segment() (no de este parsing block): art_re.match() opera por
  #    línea física, así que cuando el Markdown fusiona varios artículos derogados en una
  #    sola línea, solo el primer "**Artículo N" de esa línea se convierte en Article; el
  #    resto queda como texto dentro del cuerpo del primero (o se pierde si la línea ni
  #    siquiera empieza con "**Artículo"). Dos casos reales: línea ~923 fusiona 149 y 150
  #    (se pierde 1); línea ~5521 (Título Octavo "De los Derechos de Autor", derogado en
  #    bloque DOF 14-01-1948) fusiona los 12 artículos 1181-1192 en una sola línea que
  #    además empieza con "_Título derogado..." y no con "**Artículo", así que los 12 se
  #    pierden enteros (ni contaminan el artículo anterior: cur ya es None ahí). Total: 13
  #    artículos perdidos por esta causa. No se puede arreglar desde parsing_pattern/
  #    page_furniture (que solo puede BORRAR líneas completas, no partirlas) sin tocar
  #    segment() en pipeline.py, que pertenece a otro agente en esta ronda.
  #  - Techo de recall alcanzable calibrando solo regex: 3074 - 42 (OCR) - 13 (fusión de
  #    línea) = 3019 artículos (~98.2%). Confirmado empíricamente: ver resultado real del
  #    pipeline más abajo.
  parsing:
    article_pattern: '(?i)^#{0,4}\s*\*{0,2}\s*art[íi]culo\s+(?P<num>\d+)\s*(?P<suffix>(?:bis|ter|quater|quinquies|sexies|[a-z])(?=[.\s*]|$))?\.?\s*[*\-–—\s]*'
    final_article_pattern: '(?i)^Art[íi]culo\s+[Ff]inal\b'
    levels:
      - type: preliminar
        pattern: '(?i)^#{0,4}\s*\*{0,2}\s*Disposiciones\s+Preliminares\b'
      - type: libro
        pattern: '(?i)^\|?\s*#{0,4}\s*\*{0,2}\s*LIBRO\s+(?P<ord>[IVXLCDM]+|[A-ZÁÉÍÓÚÑ]+(?:\s+[A-ZÁÉÍÓÚÑ]+)?)\b'
      - type: titulo
        pattern: '(?i)^#{0,4}\s*\*{0,2}\s*T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|PRELIMINAR|[A-ZÁÉÍÓÚÑ]+(?:\s+[A-ZÁÉÍÓÚÑ]+)?)\b'
      - type: capitulo
        pattern: '(?i)^#{0,4}\s*\*{0,2}\s*CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|[ÚU]NICO)\b'
      - type: seccion
        pattern: '(?i)^#{0,4}\s*\*{0,2}\s*SECCI[ÓO]N\s+(?P<ord>[IVXLCDM]+|[A-ZÁÉÍÓÚÑ]+(?:\s+[A-ZÁÉÍÓÚÑ]+)?)\b'
    superseded_block_markers:
      - '(?i)^\(se\s+derog[oó]\)?\s*$'
    editorial_markers:
      - '(?i)_[^_]{0,300}?(reformad[oa]|derogad[oa]|adicionad[oa]|reforma\b|fe de erratas)[^_]{0,300}?_'
      - '(?i)\*\*Nota:\*\*[^\n]*'
    page_furniture:
      - '(?i)^\*\*<u>C[ÓO]DIGO CIVIL FEDERAL</u>\*\*\s*$'
      - '(?i)^_[ÚU]ltima Reforma DOF[^_]*_\s*$'
      - '(?i)^\*\*C[ÁA]MARA DE\s?DIPUTADOS DEL\s?H\. CONGRESO DE LA\s?UNI[ÓO]N\*\*'
      - '(?i)^\|\s*\*\*C[ÁA]MARA DE\s?DIPUTADOS'
      - '^\|-+\|\s*$'
      - '(?i)^\|Secretar[íi]a'
      - '^\d{1,4} de 368\s*$'
      - '<!--\s*(Start|End) of picture text\s*-->'
    # TODO: si se recalibra el pipeline para soportar múltiples artículos por línea física
    # (ver nota arriba sobre segment()), revisar de nuevo los 13 artículos perdidos por
    # fusión de línea (149-150, 1181-1192) — no son pérdida de fuente, son recuperables.
  codification_scope:
    included:
    - Código Civil Federal
    excluded:
    - Códigos estatales
    rationale: federal únicamente
  expected_article_count: 3074

MX-CDMX:
  jurisdiction: MX
  code_id: CCDMX
  year_tag: '1928'
  display_name: Código Civil para el Distrito Federal / Ciudad de México
  adapter: generic_es
  raw_file: Codigo_Civil_Mexico_DF.md
  source:
    official: true
    url: https://www.congresocdmx.gob.mx/media/documentos/ad63a5bd2aef33e50ef1ed68d82450cf368578c0.pdf
    version_date: '2021-03-02'
    note: Congreso de la Ciudad de México.
    verified_by: Juan Pablo López Mejía
    license: "dominio público — texto oficial, sin restricción de uso conocida"
    retrieved_at: null  # TODO: requiere que el autor confirme la fecha real de captura
  # --- Parsing CALIBRADO contra data/raw/Codigo_Civil_Mexico_DF.md real (2026-09-10) ---
  # Verificado línea por línea con grep/lectura directa del raw_file (el agente
  # original de este bloque se cortó por rate-limit antes de escribir nada; lo
  # calibré directamente, retomando desde el alias sin tocar).
  # Marcador real: "ARTICULO N°.- texto" (sin acento en "ARTICULO", sin negrita
  # Markdown, a diferencia de MX-CCF que comparte linaje textual pero SÍ usa
  # negrita — no asumir que ambos códigos se parsean igual).
  # Hallazgo dominante: 93 artículos llevan hasta 3 notas de reforma entre
  # paréntesis PEGADAS delante del marcador en la misma línea, ej.
  # "(REFORMADO, G.O. 25 DE MAYO DE 2000) ARTICULO 1°.-" — el patrón previo
  # (heredado del scaffold genérico, anclado a "ARTICULO" en col. 0) no
  # matcheaba ninguno de estos 93 (entre ellos el Art. 1 y el Art. 14, que
  # aparecían en la lista de "ausentes"). Se agregó un prefijo opcional
  # "(?:\([^)]*\)\s*){0,3}" que tolera hasta 3 notas consecutivas.
  # No se encontraron sufijos BIS/TER/letra reales en este corpus (0 casos,
  # a diferencia de MX-CCF que sí tiene "2448 A".."2448 L").
  # Furniture real: pie de página "INSTITUTO DE INVESTIGACIONES LEGISLATIVAS"
  # (362 veces) y encabezado "**CONGRESO DE LA CIUDAD DE MÉXICO**" (366 veces).
  # Niveles: LIBRO/TITULO/CAPITULO con ordinales en palabra española
  # (PRIMERO, DECIMOQUINTO) — roman_to_int()/WORD_ORD de pipeline.py ya los
  # resuelve (a diferencia del portugués de BR-CC). No se detectó SECCIÓN
  # como nivel propio en este corpus (si existe, es minoritario y quedó
  # fuera del recall verificado).
  # Recall final: 2993/3074 (97.4%). Residual no resuelto, mismo límite
  # arquitectónico que BR-CC: varios artículos derogados consecutivos
  # quedan empaquetados en una sola línea del raw_file (ej. "ARTICULO 71.-
  # (DEROGADO...) ARTICULO 72.- (DEROGADO...) ARTICULO 73.- (DEROGADO...)"
  # todo en una línea) — el pipeline solo reconoce un artículo por línea
  # (re.match, no re.finditer en src/pipeline.py), así que solo el primero
  # de cada grupo se captura. Un caso adicional minoritario (Art. 146) lleva
  # un prefijo "N. DE E. ..." sin paréntesis antes de la nota de reforma,
  # variante no cubierta por el prefijo "(?:\([^)]*\)\s*){0,3}".
  parsing:
    article_pattern: '(?i)^(?:\([^)]*\)\s*){0,3}ARTICULO\s*(?P<num>\d+)\s*[°º]?\s*(?:-\s*(?P<suffix>[A-Z]|bis|ter))?[.\-\s]*'
    final_article_pattern: '(?i)^ARTICULO\s+[Ff]inal\b'
    levels:
      - type: libro
        pattern: '(?i)^LIBRO\s+(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
      - type: titulo
        pattern: '(?i)^T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO|SEXTO|S[EÉ]PTIMO|OCTAVO|NOVENO|D[EÉ]CIMO(?:\s*(?:PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO|SEXTO|S[EÉ]PTIMO|OCTAVO|NOVENO))?|PRELIMINAR)\b'
      - type: capitulo
        pattern: '(?i)^CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
      - type: seccion
        pattern: '(?i)^SECCI[ÓO]N\s+(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA)\b'
    superseded_block_markers: []
    editorial_markers:
      - '(?i)^N\.\s*DE\s*E\..*'
      - '(?i)\((?:REFORMADO|ADICIONADO|F\.\s*DE\s*E\.)[^)]*\)'
    # "(DEROGADO...)" se deja FUERA de editorial_markers a propósito: en ~200
    # artículos derogados esa nota es el CUERPO ENTERO del artículo — si se
    # extrae como nota editorial y se strip()ea del cuerpo (pipeline.py:110),
    # el cuerpo queda vacío y dispara qa_flag "empty_body" en cada uno
    # (regresión real detectada al calibrar: empty_body pasó de 0 a 202).
    # Se deja como texto de cuerpo visible, igual que el criterio ya usado
    # para los stubs "Derogado por..." de CO-CC.
    page_furniture:
      - '^INSTITUTO DE INVESTIGACIONES LEGISLATIVAS\s*$'
      - '^\*\*CONGRESO DE LA CIUDAD DE M[ÉE]XICO\*\*\s*$'
      - '^\d{1,4}$'
  codification_scope:
    included:
    - Código Civil para el Distrito Federal
    excluded:
    - Código Civil Federal
    rationale: corpus independiente
  expected_article_count: 3074

PE-CC:
  jurisdiction: PE
  code_id: CC
  year_tag: '1984'
  display_name: Código Civil del Perú (D. Leg. 295)
  adapter: generic_es
  raw_file: CODIGO_CIVIL_peruano.md
  source:
    official: true
    url: https://www.pj.gob.pe/wps/wcm/connect/59a5b5004d90ae7684d9f4db524a342a/C%C3%B3digo+Civil+1984.pdf?MOD=AJPERES
    note: Poder Judicial del Perú. D. Leg. 295.
    verified_by: Juan Pablo López Mejía
    license: "dominio público — texto oficial, sin restricción de uso conocida"
    retrieved_at: null  # TODO: requiere que el autor confirme la fecha real de captura
  # --- Parsing CALIBRADO contra data/raw/CODIGO_CIVIL_peruano.md real (2026-09-10) ---
  # Se rompe el alias al scaffold *parsing_generic_es_scaffold porque ese patrón
  # (`^Art[íi]culo\s+(?P<num>\d+)...`, ancla estricta al inicio de línea) no
  # matchea NADA en este archivo: cada artículo real viene precedido de
  # marcado Markdown (`### **<u>...`) que el scaffold no contempla.
  #
  # Hallazgos de la inspección línea por línea (ver Grep/Read directos sobre
  # el raw_file, no verificados de oídas):
  #   1. Encabezado de artículo casi siempre "### **<u>Artículo N.- Título</u>**",
  #      pero el prefijo "###" es INCONSISTENTE: 26 artículos reales (ej. L.545,
  #      815, 3399, 6169, 11677-11745, 12985 "Artículo 2117") aparecen SIN los
  #      "###" — solo "**<u>Artículo N.-...". article_pattern hace el prefijo de
  #      almohadillas/negrita/subrayado todo opcional para cubrir ambos casos.
  #   2. Los artículos derogados sin contenido (1906-1922, Título XI) quedan como
  #      placeholder "**<u>Artículo N.-</u> (*)**" seguido de una nota de vigencia
  #      en línea aparte — el número se conserva en la numeración oficial, así que
  #      SÍ deben contar para expected_article_count (confirmado: sin este rango
  #      quedaban huecos en la secuencia 1-2122).
  #   3. Sufijo de subartículo: solo aparece UNA vez en todo el corpus
  #      ("Artículo 141-A.- Formalidad", L.1107), con guion antes de la letra
  #      (no "bis/ter" como en otras familias hispanas). El grupo suffix exige
  #      el guion inmediatamente antes de la letra para no confundirse con el
  #      separador "N.- Título" (ambigüedad que menciona el contexto de esta
  #      tarea: "sufijo ordinal pegado al número").
  #   4. Falsos positivos evitados a propósito: notas editoriales al pie también
  #      usan encabezado "### **(*) Artículo vigente/derogado/sustituido..." —
  #      llevan "(*)" ENTRE "**" y "Artículo", así que no matchean article_pattern
  #      (que exige "Artículo" inmediatamente tras el marcado opcional). Verificado
  #      contra las 39 líneas "### ...Artículo..." que no son artículos reales.
  #   5. Anomalía real de OCR/edición no normalizable por regex: L.7069 es un
  #      artículo (1080) con el encabezado duplicado/mezclado 4 veces en una sola
  #      línea ("### **Artículo 1080.** -E **<u>Artículo 1080.-</u>** <u>Artículo
  #      1080.-Aaa</u> **<u>Artículo 1080.- Obligación de devolver la prenda</u>**").
  #      article_pattern matchea la primera ocurrencia (num=1080) correctamente;
  #      el resto de la línea queda como ruido en el cuerpo del artículo — no se
  #      intenta "limpiar" eso con regex adicional porque el texto fuente en sí
  #      está corrupto en ese punto, no es un problema de calibración del patrón.
  #      Igualmente L.4181/4183 duplica el encabezado de "Artículo 594.-" (uno sin
  #      formato, uno con) — el segundo es rechazado por la deduplicación por
  #      (num, suffix) que ya trae pipeline.py (rejected_non_monotonic), sin
  #      pérdida del artículo real.
  #   6. Los 10 artículos del Título Preliminar usan numeración ROMANA
  #      ("Artículo I.-" … "Artículo X.-"). pipeline.py hace `int(m.group("num"))`
  #      sin fallback para romanos, así que se los deja FUERA de article_pattern
  #      a propósito (\d+ estricto): matchean nada, no rompen el pipeline, y no
  #      se cuentan contra expected_article_count porque ese valor (2122) es
  #      exactamente el máximo de artículo arábigo real (confirmado: números
  #      únicos 1..2122 sin huecos una vez aplicado este patrón). Limitación
  #      compartida de pipeline.py (num: int), no corregida aquí porque ese
  #      archivo es de otro agente en esta ronda — igual que la nota ya dejada
  #      en el scaffold de CL-CC sobre roman_to_int()/WORD_ORD.
  #   7. Jerarquía real: LIBRO (##, romano I-X) > SECCIÓN (##, ordinal femenino
  #      PRIMERA..SEXTA — el scaffold genérico solo traía hasta QUINTA y además
  #      la rankeaba DEBAJO de capítulo; aquí SECCIÓN va entre LIBRO y TÍTULO,
  #      que es como aparece de verdad: "LIBRO I" -> "SECCION PRIMERA" -> "TITULO
  #      I" -> "CAPITULO PRIMERO") > TÍTULO (###, romano I-XV, más "UNICO" y
  #      "PRELIMINAR"/"FINAL" como casos especiales) > CAPÍTULO (###, ordinal
  #      masculino PRIMERO..DECIMO más "UNICO") > SUB-CAPITULO (###, romano
  #      I-VI; nivel real no contemplado en el scaffold, aparece dentro de
  #      Propiedad/Copropiedad/Compraventa/Mandato/Depósito). "PARTE" y
  #      "PARRAFO" del scaffold genérico no existen como encabezado en este
  #      corpus — se quitan para no arriesgar falsos positivos (p.ej. notas que
  #      empiezan con "Párrafo agregado por..." como encabezado ###).
  #   8. Furniture real: solo números de página sueltos en línea propia
  #      ("^\d{1,4}$", confirmado 1-312). No hay cabecera/pie repetido tipo
  #      "CODIGO CIVIL" por página — se mantiene el patrón "página N" del
  #      scaffold como defensivo aunque no se haya observado, por si el OCR
  #      lo usa en algún tramo no muestreado.
  #   9. final_article_pattern: no existe un marcador "Artículo Final" en este
  #      corpus (el "TITULO FINAL" cierra con el artículo 2122 numerado normal,
  #      no con un artículo especial) — se deja null.
  #
  # Resultado tras calibrar (ver reports/PE-CC_run_report.json,
  # corrida real de `python -m src.pipeline PE-CC`): segment_stats
  # .articles_parsed == 2122 == expected_article_count, compuerta
  # "completitud" en PASS. La compuerta "consistencia_N4" se ignora a
  # propósito (limitación compartida y conocida del pipeline, no depende
  # de esta calibración — ver instrucciones de la ronda).
  parsing:
    article_pattern: '(?i)^#{0,6}\s*\*{0,2}\s*(?:<u>)?\s*Art[íi]culo\s+(?P<num>\d+)(?:\s*[-–—]\s*(?P<suffix>bis|ter|quater|quinquies|[A-Z]))?\.?\s*[-–—]?\s*'
    final_article_pattern: null
    levels:
      - type: libro
        pattern: '(?i)^#{0,6}\s*\*{0,2}\s*(?:<u>)?\s*LIBRO\s+(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO)\b'
      - type: seccion
        pattern: '(?i)^#{0,6}\s*\*{0,2}\s*(?:<u>)?\s*SECCI[ÓO]N\s+(?P<ord>[IVXLCDM]+|PRIMERA|SEGUNDA|TERCERA|CUARTA|QUINTA|SEXTA)\b'
      - type: titulo
        pattern: '(?i)^#{0,6}\s*\*{0,2}\s*(?:<u>)?\s*T[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|UNICO|PRELIMINAR|FINAL)\b'
      - type: capitulo
        pattern: '(?i)^#{0,6}\s*\*{0,2}\s*(?:<u>)?\s*CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+|PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO|SEXTO|SEPTIMO|OCTAVO|NOVENO|DECIMO|UNICO)\b'
      - type: subcapitulo
        pattern: '(?i)^#{0,6}\s*\*{0,2}\s*(?:<u>)?\s*SUB-CAP[ÍI]TULO\s+(?P<ord>[IVXLCDM]+)\b'
    superseded_block_markers: []
    editorial_markers:
      - '(?i)\(\*+\)\s*(?:Art[íi]culo|P[áa]rrafo|Inciso)\s+[^.]*?\.'
      - '(?i)Nota:\s*[^.]*?\.(?:\s*[^.]*?\.)?'
      - '(?i)CONCORDANCIA:\s*[^*<]*'
    page_furniture:
      - '^\d{1,4}\s*$'
      - '(?i)^p[áa]gina\s+\d+'
  codification_scope:
    included:
    - Código Civil 1984
    excluded: []
    rationale: solo texto codificado
  expected_article_count: 2122

